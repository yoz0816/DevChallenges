<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="resources/favicon.ico" type="image/x-icon" sizes="96x96"/>
    <link rel="stylesheet" href="style.css">
    <title>Contact Page | devChallenges.io</title>
  </head>
  <body>
    <main>
      <img class="logo" src="resources/Logo.svg" alt="">
      <section class="hero-section">
         <h1>Interested in our business pricing?</h1>
         <p>Fill out the form to view details and we’ll contact you as soon as possible.</p>

         <div class="from">
          <form>
            <div class="form-start">
            <article class="name">
              <label for="name">Name</label>
              <input type="text" id="name" name="name" placeholder="Ethan Johnson">
            </article>

            <article class="email">
              <label for="email">Company Email</label>
              <input type="email" id="email" name="email" placeholder="ethan@johnson.com">
            </article>
            </div>

            <div class="from-middle">
               <article class="size">
                  <label for="size">Company Size</label>
                  <input type="text" id="size" name="size" placeholder="50-100 employees">
                  <img src="resources/Expand_down.svg" alt="">
              </article>

              <article class="subject">
                <label for="subject">Subject</label>
                <input type="text"id="subject" name="subjcet" placeholder="Building Landing pages">
                <img src="resources/Expand_down.svg" alt="">
              </article>
            </div>

            <div class="from-end">
              <article class="msg">
              <label for="message">Message</label>
              <textarea name="message" id="message" placeholder="50-100 employees"></textarea>
              </article>

              <button class="btn" type="submit" >Contact Sales</button>

            </div>
          </form>

         </div>
      </section>

    </main>

    <div class="author-info">
      Coded by <a href="#">Yoz</a> | Challenge by
      <a href="https://www.devchallenges.io?ref=challenge" target="_blank"
        >devChallenges.io</a
      >.
    </div>
  </body>
</html>
