<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="resources/favicon.ico" type="image/x-icon" sizes="96x96"/>
    <link rel="stylesheet" href="style.css">
    <title>Simple Homepage - Alarado | devChallenges.io</title>
  </head>
  <body>
    <main class="container">
      <header class="header">
         <div class="brand">
          <img src="resources/logo-light.svg" alt="Alarado Logo">
         </div>

         <nav class="nav-bar">
            <a href="#" class="active">About us</a>
            <a href="#">Product</a>
            <a href="#">Resource</a>
            <a href="#">Contact</a>
         </nav>

         <div class="header-actions">
           <div class="light">
             <img src="resources/Moon_fill_light.svg" alt="Dark mode toggle">
             <img class="image2" src="resources/Sun_fill.svg" alt="Light mode toggle">
           </div>
           <button class="menu-btn" aria-label="Open menu">
             <img src="resources/menu.svg" alt="Menu">
           </button>
         </div>
      </header>

      <section class="hero-section">
        <article class="hero-content">
          <p class="paragraph1">😎 SIMPLE WAY TO COMMUNICATE</p>
          <h1>Actions for Accessibility in Design</h1>
          <p class="description">The fastest way to build and deploy websites with resusable components.</p>

          <div class="links">
            <button class="btn">GET STARTED</button>
            <a href="#" class="demo-link">Get live demo</a>
          </div>

          <div class="detail">
            <article class="detail-cards">
              <img src="resources/Done_ring_round_fill.svg" alt="Check mark">
              <p>No credit card required</p>
            </article>

            <article class="detail-cards">
              <img src="resources/Done_ring_round_fill.svg" alt="Check mark">
              <p>No software to install</p>
            </article>
          </div>
        </article>

        <article class="hero-image">
          <img src="resources/hero-image-simple-homepage.png" alt="Hero Illustration">
        </article>
      </section>
    </main>

    <footer class="author-info">
      Coded by <a href="#">Yoz</a> | Challenge by
      <a href="https://www.devchallenges.io?ref=challenge" target="_blank">devChallenges.io</a>.
    </footer>
  </body>
</html>
