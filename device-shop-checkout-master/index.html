<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="resources/favicon.ico" type="image/x-icon" sizes="96x96"/>
    <link rel="stylesheet" href="style.css">
    <title>Device Shop Checkout | devChallenges.io</title>
  </head>
  <body>
    <main class="container">
      <div class="header">
        <h1>Checkout</h1>
        <p>3 items</p>
      </div>
      
    <section class="hero-container">
      <section class="hero-section">
        <div class="item-section">
          <article class="items">

            <div class="images">
               <img src="resources/Gold.png" alt="">
            </div>

            <div class="item-detail">
              <article class="item-name">
                <div class="item-left-name">
                   <h2>iPhone 12 Pro</h2>
                   <p>Golden</p>
                 </div>
                <div class="price">
                   <h3>$999.00</h3>
                 </div>
              </article>

              <article class="item-end">
                 <p>x 1</p>
                 <img src="resources/close-icon.svg" alt="">
              </article>

             </div>
          </article>

           <article class="items">
            <div class="images">
               <img src="resources/Apple-watch.png" alt="">
            </div>

            <div class="item-detail">
              <article class="item-name">
                <div class="item-left-name">
                   <h2>Apple Watch</h2>
                   <p>Blue</p>
                 </div>
                <div class="price">
                    <h3>$399.00</h3>
                 </div>
              </article>

              <article class="item-end">
                 <p>x 1</p>
                 <img src="resources/close-icon.svg" alt="">
              </article>

             </div>
          </article>

           <article class="items">
            <div class="images">
               <img src="resources/iMac.png" alt="">
            </div>

            <div class="item-detail">
              <article class="item-name">
                <div class="item-left-name">
                   <h2>iMac</h2>
                   <p>Green</p>
                 </div>
                <div class="price">
                     <h3>$1199.00</h3>
                 </div>
              </article>

              <article class="item-end">
                 <p>x 1</p>
                 <img src="resources/close-icon.svg" alt="">
              </article>

             </div>
          </article>
          </div>

        <div class="search-section">
          <label for="site-search"></label>
          <input type="search" id="site-search" name="q" placeholder="Enter coupon code">
          <div class="btn">
             <button type="submit">Apply Coupon</button>
          </div>
        </div>

        <div class="footer-section">
          <article class="footer-detail">
            <h4>Sub total</h4>
             <p>$2597.00</p>
          </article>
          <article class="footer-detail">
            <h4>Tax</h4>
            <p>$623.28</p>
          </article>
          <article class="footer-detail-total">
            <h4>Total</h4>
            <p>$3220.28</p>
          </article>
        </div>
      </section>

      <section class="form">
        <h5> Contact Information</h5>
        <form>
          <label for="name">First & Last name</label>
          <input type="text" id="name" name="name" placeholder="Enter first & last name">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder=" Enter email address">

        <div class="country-code">

              <div class="country">
                  <label for="country">Country</label>
                  <select name="country" id="country">
                      <option value="Finland" selected>Finland</option>
                      <option value="England">England</option>
                      <option value="France">France</option>
                  </select>
              </div>

              <div class="postal">
                  <label for="postal-code">Postal Code</label>
                  <input
                      type="text"
                      id="postal-code"
                      name="postal-code"
                      placeholder="00270"
                  >
              </div>

          </div>
        </form>
        <button class="btn-continue">Continue</button>
      </section>
      </section>

    </main>
    <div class="author-info">
      Coded by <a href="#">Yoz</a> | Challenge by
      <a href="https://www.devchallenges.io?ref=challenge" target="_blank"
        >devChallenges.io</a
      >.
    </div>
  </body>
</html>
