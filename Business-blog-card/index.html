<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="resources/favicon.ico" type="image/x-icon" sizes="96x96"/>
    <link rel="stylesheet" href="style.css" />
    <title>Business Blog Card | devChallenges.io</title>
  </head>
  <body>
    <main class="container">
      <section class="hero-section">
        <div class="image-wrapper">
          <img  class="hero-image" src="resources/hero-image.jpg" alt="People having coffee together"/>

          <img class="white-overlay" src="resources/white-overlay.svg"alt=""/>
        </div>

        <article class="header">
          <h1>Perfect solution for small business</h1>
          <p>
            Small businesses need to generate leads to grow.
            You can use tools like Ringy.
          </p>
        </article>

        <div class="profile">
          <img
            src="resources/avatar-image-business-card.png"
            alt="Amy Burgess"
          />

          <div class="profile-name">
            <h2>Amy Burgess</h2>
            <p>Customer Manager, Solution Oy</p>
          </div>
        </div>

      </section>
    </main>

    <div class="author-info">
      Coded by <a href="#">Yoz</a> | Challenge by
      <a
        href="https://www.devchallenges.io?ref=challenge"
        target="_blank"
      >
        devChallenges.io
      </a>.
    </div>
  </body>
</html>
