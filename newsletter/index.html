<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="resources/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <title>Join Our Newsletter | devChallenges.io</title>
</head>
<body>

    <main class="container">
        <section class="hero-section">
            <img src="resources/logo.svg" alt="Newsletter logo" class="logo">
            <h1>Join our newsletter</h1>
            <p class="description">
                Keep up with our latest collections, exclusive deals, and special offers!
                We introduce a new collection every week, so stay tuned to snag the
                hottest items just for you.
            </p>

            <form class="form">
                <label for="email" class="sr-only"> Email address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                <button type="submit" class="btn">Subscribe now</button>
                <p class="privacy">
                    Your email is 100% confidential and won’t send you any spam.
                </p>
            </form>
        </section>

    </main>

    <div class="author-info">
        Coded by <a href="#">Yoz</a> |
        Challenge by
        <a
            href="https://www.devchallenges.io?ref=challenge"
            target="_blank"
        >
            devChallenges.io
        </a>
    </div>

</body>
</html>
